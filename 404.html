<!DOCTYPE html>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title> 404 - 小炎的个人主页 </title>
    <script src="components/load-css.js"></script>
</head>
<body>
    <div id="header-placeholder"></div>
    <main>
        <div class="tile-container">
            <div class="glass-card tile tile-nohover tile-full-width" style="text-align: center">
                <h3>404</h3>
                <p style="text-align: center">页面被小猫当窝了喵</p>
                <p><br><br><br><br><br></p>
                <a href="/" class="btn">返回主页</a>
            </div>
        </div>
    </main>
    <div id="footer-placeholder"></div>
    <script>
        fetch('/components/header.html')
            .then(r => r.text())
            .then(html => document.getElementById('header-placeholder').innerHTML = html);
        fetch('/components/footer.html')
            .then(r => r.text())
            .then(html => document.getElementById('footer-placeholder').innerHTML = html);
    </script>
</body>
</html>
